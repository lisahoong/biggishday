<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokemon GO Dashboard</title>
<style>
  :root {
    --bg: #dcc7ea;
    --card-bg: #ffffff;
    --card-border: #f0b429;
    --title-border: #f0b429;
    --text: #2b2130;
    --muted: #7a6d85;
    --accent: #8e4fc9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 32px 24px 60px;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto 28px;
  }

  h1 {
    background: var(--card-bg);
    border: 2px solid var(--title-border);
    border-radius: 16px;
    padding: 16px 28px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    margin: 0;
    box-shadow: 0 2px 0 rgba(0,0,0,0.04);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--muted);
  }

  #refreshBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  #refreshBtn:hover { opacity: 0.9; }
  #refreshBtn:active { transform: scale(0.97); }
  #refreshBtn:disabled { opacity: 0.6; cursor: default; }

  .spin { display: inline-block; animation: spin 0.9s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .error-banner {
    max-width: 1100px;
    margin: 0 auto 20px;
    background: #fff3f0;
    border: 2px solid #e05656;
    color: #8a2c2c;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 14px;
    display: none;
  }
  .error-banner.show { display: block; }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1.15fr;
    grid-template-rows: auto auto;
    gap: 22px;
  }

  .card {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
    min-height: 150px;
  }

  .card.shinies {
    grid-column: 3;
    grid-row: 1 / span 2;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
    line-height: 1.35;
  }

  .date-frame {
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 12px;
  }

  .boss-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .boss-visual {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    min-height: 90px;
  }

  .boss-icon-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .boss-icon {
    width: 76px;
    height: 76px;
    object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
  }

  .boss-icon-label {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    max-width: 90px;
  }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 10px 0;
  }

  .shiny-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    align-content: center;
    justify-items: center;
  }

  .shiny-icon {
    width: 84px;
    height: 84px;
    object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
  }

  .shiny-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .shiny-label {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  .skeleton {
    opacity: 0.5;
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .card.shinies { grid-column: 1 / span 2; grid-row: auto; }
  }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .card.shinies { grid-column: 1; }
  }
</style>
</head>
<body>

  <div class="top-bar">
    <h1>Pokemon Dashboard</h1>
    <div class="controls">
      <span id="lastUpdated">Not loaded yet</span>
      <button id="refreshBtn" onclick="loadDashboard()">
        <span id="refreshIcon">&#8635;</span> Refresh
      </button>
    </div>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="grid">
    <div class="card" id="card-current-4">
      <div class="card-title">Current 4-Star Raid Boss (Mega)</div>
      <div class="date-frame" id="date-current-4">—</div>
      <div class="boss-visual" id="visual-current-4"><div class="empty-state">Loading…</div></div>
    </div>

    <div class="card" id="card-current-5">
      <div class="card-title">Current 5-Star Raid Boss</div>
      <div class="date-frame" id="date-current-5">—</div>
      <div class="boss-visual" id="visual-current-5"><div class="empty-state">Loading…</div></div>
    </div>

    <div class="card shinies" id="card-shinies">
      <div class="card-title">Boosted Shinies</div>
      <div class="date-frame" id="date-shinies">—</div>
      <div class="shiny-grid" id="visual-shinies"><div class="empty-state">Loading…</div></div>
    </div>

    <div class="card" id="card-next-4">
      <div class="card-title">Coming Next: 4-Star Raid Boss (Mega)</div>
      <div class="date-frame" id="date-next-4">—</div>
      <div class="boss-name" id="name-next-4">Loading…</div>
    </div>

    <div class="card" id="card-next-5">
      <div class="card-title">Coming Next: 5-Star Raid Boss</div>
      <div class="date-frame" id="date-next-5">—</div>
      <div class="boss-name" id="name-next-5">Loading…</div>
    </div>
  </div>

<script>
  const EVENTS_URL = 'https://raw.githubusercontent.com/bigfoott/ScrapedDuck/data/events.json';

  function parseTier(eventName) {
    const m = eventName.match(/(\d)-star Raid Battles/i);
    if (m) return m[1] + '-star';
    if (/mega raids/i.test(eventName)) return '4-star';
    return null;
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function fmtRange(startIso, endIso) {
    return `${fmtDate(startIso)} – ${fmtDate(endIso)}`;
  }

  function isActive(ev, now) {
    return new Date(ev.start) <= now && now <= new Date(ev.end);
  }

  function renderBossVisual(containerId, bosses) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    bosses.forEach(b => {
      const wrap = document.createElement('div');
      wrap.className = 'boss-icon-wrap';
      const img = document.createElement('img');
      img.className = 'boss-icon';
      img.src = b.image;
      img.alt = b.name;
      img.loading = 'lazy';
      const label = document.createElement('div');
      label.className = 'boss-icon-label';
      label.textContent = b.name;
      wrap.appendChild(img);
      wrap.appendChild(label);
      el.appendChild(wrap);
    });
  }

  function renderEmpty(containerId, message) {
    document.getElementById(containerId).innerHTML = `<div class="empty-state">${message}</div>`;
  }

  function renderCurrentTierCard(tier, events, now) {
    const suffix = tier === '4-star' ? '4' : '5';
    const dateEl = document.getElementById(`date-current-${suffix}`);
    const visualId = `visual-current-${suffix}`;

    const active = events.find(ev =>
      ev.eventType === 'raid-battles' &&
      parseTier(ev.name) === tier &&
      isActive(ev, now)
    );

    if (!active) {
      dateEl.textContent = 'No active window';
      renderEmpty(visualId, `No ${tier} raid boss is currently active.`);
      return;
    }

    dateEl.textContent = fmtRange(active.start, active.end);
    const bosses = (active.extraData && active.extraData.raidbattles && active.extraData.raidbattles.bosses) || [];
    if (bosses.length === 0) {
      renderEmpty(visualId, 'No boss details available.');
    } else {
      renderBossVisual(visualId, bosses);
    }
  }

  function renderNextTierCard(tier, events, now) {
    const suffix = tier === '4-star' ? '4' : '5';
    const dateEl = document.getElementById(`date-next-${suffix}`);
    const nameEl = document.getElementById(`name-next-${suffix}`);

    const upcoming = events
      .filter(ev => ev.eventType === 'raid-battles' && parseTier(ev.name) === tier && new Date(ev.start) > now)
      .sort((a, b) => new Date(a.start) - new Date(b.start));

    if (upcoming.length === 0) {
      dateEl.textContent = 'Not announced yet';
      nameEl.textContent = '—';
      return;
    }

    const next = upcoming[0];
    dateEl.textContent = fmtRange(next.start, next.end);
    const bosses = (next.extraData && next.extraData.raidbattles && next.extraData.raidbattles.bosses) || [];
    nameEl.textContent = bosses.length ? bosses.map(b => b.name).join(', ') : next.name;
  }

  function renderShinies(events, now) {
    const dateEl = document.getElementById('date-shinies');
    const visualId = 'visual-shinies';

    const active = events.filter(ev => ev.eventType === 'raid-battles' && isActive(ev, now));

    const seen = new Map();
    let minStart = null, maxEnd = null;

    active.forEach(ev => {
      const shinies = (ev.extraData && ev.extraData.raidbattles && ev.extraData.raidbattles.shinies) || [];
      if (shinies.length === 0) return;
      const start = new Date(ev.start);
      const end = new Date(ev.end);
      if (minStart === null || start < minStart) minStart = start;
      if (maxEnd === null || end > maxEnd) maxEnd = end;
      shinies.forEach(s => {
        if (!seen.has(s.name)) seen.set(s.name, s);
      });
    });

    const shinyList = Array.from(seen.values());

    if (shinyList.length === 0) {
      dateEl.textContent = 'No boosted shinies right now';
      renderEmpty(visualId, 'No raid bosses with a shiny chance are active right now.');
      return;
    }

    dateEl.textContent = fmtRange(minStart.toISOString(), maxEnd.toISOString());

    const el = document.getElementById(visualId);
    el.innerHTML = '';
    shinyList.forEach(s => {
      const item = document.createElement('div');
      item.className = 'shiny-item';
      const img = document.createElement('img');
      img.className = 'shiny-icon';
      img.src = s.image;
      img.alt = s.name + ' (shiny)';
      img.loading = 'lazy';
      const label = document.createElement('div');
      label.className = 'shiny-label';
      label.textContent = s.name;
      item.appendChild(img);
      item.appendChild(label);
      el.appendChild(item);
    });
  }

  function showError(message) {
    const banner = document.getElementById('errorBanner');
    banner.textContent = message;
    banner.classList.add('show');
  }

  function hideError() {
    const banner = document.getElementById('errorBanner');
    banner.classList.remove('show');
    banner.textContent = '';
  }

  async function loadDashboard() {
    const btn = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    btn.disabled = true;
    icon.classList.add('spin');
    hideError();

    try {
      const res = await fetch(EVENTS_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Data source returned HTTP ${res.status}`);
      const events = await res.json();
      const now = new Date();

      renderCurrentTierCard('4-star', events, now);
      renderCurrentTierCard('5-star', events, now);
      renderNextTierCard('4-star', events, now);
      renderNextTierCard('5-star', events, now);
      renderShinies(events, now);

      document.getElementById('lastUpdated').textContent =
        'Updated ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (err) {
      showError('Could not load live Pokemon GO data. Check your internet connection and try refreshing. (' + err.message + ')');
    } finally {
      btn.disabled = false;
      icon.classList.remove('spin');
    }
  }

  loadDashboard();
</script>
</body>
</html>
