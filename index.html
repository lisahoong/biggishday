<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Vision Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Wedding Vision Board</h1>
      <p>Share your wedding inspiration with your planner</p>
    </header>

    <div class="upload-section">
      <div class="upload-box">
        <input type="file" id="photoInput" accept="image/*" multiple>
        <label for="photoInput">
          <span class="upload-icon">📸</span>
          <span>Click to upload photos</span>
        </label>
      </div>
    </div>

    <div class="gallery">
      <div id="photoGrid" class="photo-grid"></div>
    </div>
  </div>

  <!-- Modal for editing photo details -->
  <div id="photoModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div class="modal-body">
        <img id="modalImage" src="" alt="">
        <div class="modal-form">
          <div class="form-group">
            <label>Tags (comma-separated)</label>
            <input type="text" id="tagsInput" placeholder="e.g., flowers, color, dress">
          </div>
          <div class="form-group">
            <label>Notes</label>
            <textarea id="notesInput" placeholder="Add notes for your planner..."></textarea>
          </div>
          <button id="saveBtn" class="btn btn-primary">Save</button>
          <button id="deleteBtn" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
