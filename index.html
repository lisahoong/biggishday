<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128141;</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Wedding Planner</h1>
      <span class="brand-sub" id="brandSub"></span>
    </div>
    <div class="folder-status">
      <span class="save-indicator" id="saveIndicator"></span>
      <span class="state no" id="folderState">browser only</span>
      <button class="btn btn-secondary btn-sm" id="connectBtn" hidden>Connect Folder</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="inspiration">Inspiration</button>
    <button data-tab="palettes">Palettes</button>
    <button data-tab="budget">Budget</button>
    <button data-tab="vendors">Vendors</button>
  </nav>
</header>

<main id="main">
  <div class="banner" id="banner" hidden></div>
  <div id="tabRoot"></div>
</main>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast-stack" id="toastStack"></div>

<!-- Classic scripts, loaded in dependency order. Not ES modules: those are blocked
     over file://, and this app is meant to open by double-clicking. -->
<script src="js/ui.js"></script>
<script src="js/calc.js"></script>
<script src="js/store.js"></script>
<script src="js/tab-overview.js"></script>
<script src="js/tab-inspiration.js"></script>
<script src="js/tab-palettes.js"></script>
<script src="js/tab-budget.js"></script>
<script src="js/tab-vendors.js"></script>
<script src="js/app.js"></script>
</body>
</html>
